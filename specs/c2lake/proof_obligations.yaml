paper:
  title: "Provably secure lightweight certificateless lattice-based authenticated key exchange scheme for IIoT"
  doi: "10.1002/cpe.7983"
  security_section: "Section 6"
status_labels:
  - executable_checked
  - algebraically_checked
  - paper_proof_only
  - not_formally_verified
  - out_of_scope
claims:
  - id: correctness
    claim: "协议正确性与双方会话密钥一致"
    status: executable_checked
    evidence:
      - "核心部分私钥验证式 property tests"
      - "完整握手 K1/K2/K3 与 session key 一致性测试"
      - "独立 Python-int oracle 检查代数恒等式"
    formally_verified: false
  - id: mutual_authentication
    claim: "双向认证"
    status: executable_checked
    evidence:
      - "Alice/Bob S 验证式正向测试"
      - "公开 transcript 单字段篡改拒绝测试"
    formally_verified: false
  - id: session_key_agreement
    claim: "会话密钥协商一致"
    status: executable_checked
    evidence:
      - "H3 canonical transcript 顺序固定"
      - "literal scalar 与 audited KDF 输出一致性测试"
    formally_verified: false
  - id: replay_resistance
    claim: "重放攻击抵抗"
    status: executable_checked
    evidence:
      - "显式时间戳窗口边界测试"
      - "旧 request/response 重放窗口拒绝测试"
    formally_verified: false
  - id: impersonation_resistance
    claim: "仿冒攻击抵抗"
    status: paper_proof_only
    evidence:
      - "代码仅模拟身份和公钥分量篡改拒绝"
      - "无 eCK 对手模型形式化"
    formally_verified: false
  - id: man_in_the_middle_resistance
    claim: "中间人攻击抵抗"
    status: paper_proof_only
    evidence:
      - "代码仅覆盖公开消息单字段篡改拒绝"
      - "无完整网络对手/随机预言机模型验证"
    formally_verified: false
  - id: known_key_security
    claim: "known-key security"
    status: paper_proof_only
    evidence:
      - "不同 seed 产生不同 transcript/session key 的可执行检查"
      - "不等同于论文安全证明"
    formally_verified: false
  - id: unknown_key_share_resistance
    claim: "unknown key-share resistance"
    status: paper_proof_only
    evidence:
      - "identity 参与 H1/H2 与 transcript 编码"
      - "未形式化验证 UKS 安全定义"
    formally_verified: false
  - id: no_key_control
    claim: "no key control"
    status: paper_proof_only
    evidence:
      - "代码可观察双方 ephemeral seed 影响会话密钥"
      - "未验证任意一方无法控制最终密钥分布"
    formally_verified: false
  - id: perfect_forward_secrecy
    claim: "perfect forward secrecy"
    status: paper_proof_only
    evidence:
      - "代码不实现长期密钥泄露后的安全游戏"
      - "仅记录论文证明主张"
    formally_verified: false
  - id: known_session_key_security
    claim: "known session key security"
    status: paper_proof_only
    evidence:
      - "代码不实现多会话泄露 oracle"
      - "仅记录论文证明主张"
    formally_verified: false
  - id: type_i_adversary_proof
    claim: "Type I adversary proof"
    status: not_formally_verified
    evidence:
      - "论文证明审计，不做形式化 ROM/eCK 证明"
    formally_verified: false
  - id: type_ii_adversary_proof
    claim: "Type II adversary proof"
    status: not_formally_verified
    evidence:
      - "论文证明审计，不做形式化 ROM/eCK 证明"
    formally_verified: false
  - id: isis_reduction
    claim: "ISIS reduction"
    status: not_formally_verified
    evidence:
      - "未实现 ISIS 求解器或归约验证"
    formally_verified: false
  - id: cbi_isis_reduction
    claim: "CBi-ISIS reduction"
    status: not_formally_verified
    evidence:
      - "未实现 CBi-ISIS 求解器或归约验证"
    formally_verified: false
known_issues:
  - id: matrix_dimension_conflict
    issue: "论文前置 M 维度/秩表述与协议中 d^T M、x^T M、M y 同时成立的需求冲突。"
  - id: q_prime_vs_m_squared
    issue: "论文声称 q 为素数，但 Table 7 使用 q=m²，其中多个 q 为合数。"
  - id: h2_h3_local_field_typos
    issue: "H2/H3 列表中存在局部字段下标或字段名排版疑点，需要按 canonical transcript 固定实现。"
  - id: theorem_1_sk_label_typo
    issue: "Theorem 1 最后一行存在 SK 标签笔误。"
  - id: short_vector_bound_unclear
    issue: "部分安全证明依赖的短向量采样界未完整给出，literal/audited 需分开。"
  - id: key_agreement_timing_boundary_unspecified
    issue: "Table 7 的 Key_Agreement 计时边界未说明，复现实验需并列报告 initiator/responder/full_handshake。"
