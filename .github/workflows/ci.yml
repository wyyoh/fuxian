name: quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 更新 pip
        run: python -m pip install --upgrade pip
      - name: 安装项目与开发依赖
        run: python -m pip install -e ".[dev]"
      - name: 检查格式
        run: ruff format --check .
      - name: 静态检查
        run: ruff check .
      - name: 类型检查
        run: mypy
      - name: 单元测试
        run: python -m pytest
      - name: 构建分发包
        run: python -m build --no-isolation
      - name: 验证 wheel 内置 profile
        run: |
          python -m venv /tmp/lattice-wheel-smoke
          /tmp/lattice-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/lattice-wheel-smoke/bin/python -I -c 'from lattice_aka_repro import load_profile; assert load_profile("c2lake", "toy")["q"] == 257; assert load_profile("lcla_aka", "toy")["backend"] == "toy"'
      - name: 生成 T001 evidence 元数据
        run: |
          test -z "$(git status --porcelain=v1)"
          python scripts/capture_environment.py \
            --task-id T001 \
            --profile not_applicable \
            --backend python \
            --seed 0 \
            --warmup 0 \
            --repetitions 1 \
            --repo-root . \
            --output artifacts/processed/T001/environment.json
      - name: 校验 T001 evidence 元数据
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          metadata = json.loads(Path("artifacts/processed/T001/environment.json").read_text())
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert metadata["git_commit"] == head
          assert metadata["git_dirty"] is False
          PY
      - name: 上传 T001 evidence
        uses: actions/upload-artifact@v4
        with:
          name: T001-evidence
          path: artifacts/processed/T001/environment.json
      - name: 生成 T002 evidence
        run: python scripts/validate_specs.py --repo-root .
      - name: 校验 T002 evidence
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          metadata = json.loads(Path("artifacts/processed/T002/spec_validation.json").read_text())
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert metadata["result"] == "pass"
          assert metadata["summary"]["unexpected_error_count"] == 0
          assert metadata["metadata"]["git_commit"] == head
          assert metadata["metadata"]["git_dirty"] is False
          assert not subprocess.check_output(
              ["git", "status", "--porcelain=v1"],
              text=True,
          ).strip()
          PY
      - name: 上传 T002 evidence
        uses: actions/upload-artifact@v4
        with:
          name: T002-evidence
          path: artifacts/processed/T002/spec_validation.json
      - name: 生成 T010 evidence
        run: python scripts/validate_c2lake_core.py --repo-root .
      - name: 校验 T010 evidence
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          evidence = json.loads(
              Path("artifacts/processed/T010/c2lake_core_validation.json").read_text()
          )
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert evidence["result"] == "pass"
          assert evidence["failed_cases"] == 0
          assert evidence["protocol_key_agreement_implemented"] is False
          assert evidence["security_proof_verified"] is False
          assert evidence["git_commit"] == head
          assert evidence["git_dirty"] is False
          PY
      - name: 上传 T010 evidence
        uses: actions/upload-artifact@v4
        with:
          name: T010-evidence
          path: artifacts/processed/T010/c2lake_core_validation.json
      - name: 生成 C2LAKE security audit
        run: |
          python scripts/audit_c2lake_security_claims.py \
            --repo-root . \
            --json-output artifacts/processed/C2LAKE/ci_security_audit.json \
            --report-output artifacts/processed/C2LAKE/security_audit.md
      - name: 生成 C2LAKE cost model
        run: |
          python scripts/reproduce_c2lake_cost_tables.py \
            --repo-root . \
            --json-output artifacts/processed/C2LAKE/ci_cost_tables.json \
            --csv-output artifacts/processed/C2LAKE/ci_cost_tables.csv \
            --report-output artifacts/processed/C2LAKE/cost_tables.md
      - name: 运行 C2LAKE smoke benchmark
        run: |
          python scripts/reproduce_c2lake_table7.py \
            --repo-root . \
            --mode smoke \
            --warmup 0 \
            --repetitions 1 \
            --resume \
            --raw-output artifacts/processed/C2LAKE/ci_benchmark_raw.csv \
            --table-output artifacts/processed/C2LAKE/ci_table7_reproduced.csv \
            --comparison-output artifacts/processed/C2LAKE/ci_table7_comparison.csv \
            --trend-output artifacts/processed/C2LAKE/ci_table7_trend_summary.csv \
            --report-output artifacts/processed/C2LAKE/c2lake_benchmark_report.md
      - name: 生成 C2LAKE smoke figure
        run: |
          python scripts/reproduce_c2lake_figure4.py \
            --repo-root . \
            --figure-output artifacts/processed/C2LAKE/figure4_reproduced.png
      - name: 生成 C2LAKE full evidence
        run: |
          python scripts/validate_c2lake_full.py \
            --repo-root . \
            --mode smoke \
            --json-output artifacts/processed/C2LAKE/ci_full_validation.json \
            --report-output artifacts/processed/C2LAKE/c2lake_full_validation.md
      - name: 校验 C2LAKE full evidence
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          evidence = json.loads(
              Path("artifacts/processed/C2LAKE/ci_full_validation.json").read_text()
          )
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert evidence["result"] == "pass_with_partial_benchmark_and_unverified_formal_security"
          assert evidence["executable_validation_passed"] is True
          assert evidence["protocol_correctness"] is True
          assert evidence["K1_consistency"] is True
          assert evidence["K2_consistency"] is True
          assert evidence["K3_consistency"] is True
          assert evidence["session_key_consistency"] is True
          assert evidence["failed_protocol_cases"] == 0
          assert evidence["benchmark_status"] == "partial"
          assert evidence["formal_security_verified"] is False
          assert evidence["eck_formally_verified"] is False
          assert evidence["rom_reduction_verified"] is False
          assert evidence["git_commit"] == head
          assert evidence["git_dirty"] is False
          PY
      - name: 上传 C2LAKE full evidence
        uses: actions/upload-artifact@v4
        with:
          name: C2LAKE-full-evidence
          path: |
            artifacts/processed/C2LAKE/security_audit.json
            artifacts/processed/C2LAKE/ci_security_audit.json
            artifacts/processed/C2LAKE/security_audit.md
            artifacts/processed/C2LAKE/cost_tables.json
            artifacts/processed/C2LAKE/cost_tables.csv
            artifacts/processed/C2LAKE/ci_cost_tables.json
            artifacts/processed/C2LAKE/ci_cost_tables.csv
            artifacts/processed/C2LAKE/cost_tables.md
            artifacts/processed/C2LAKE/table7_reproduced.csv
            artifacts/processed/C2LAKE/table7_comparison.csv
            artifacts/processed/C2LAKE/table7_trend_summary.csv
            artifacts/processed/C2LAKE/ci_benchmark_raw.csv
            artifacts/processed/C2LAKE/ci_table7_reproduced.csv
            artifacts/processed/C2LAKE/ci_table7_comparison.csv
            artifacts/processed/C2LAKE/ci_table7_trend_summary.csv
            artifacts/processed/C2LAKE/c2lake_benchmark_report.md
            artifacts/processed/C2LAKE/figure4_reproduced.png
            artifacts/processed/C2LAKE/full_validation.json
            artifacts/processed/C2LAKE/ci_full_validation.json
            artifacts/processed/C2LAKE/c2lake_full_validation.md
      - name: 生成 LCLA-AKA security audit
        run: |
          python scripts/audit_lcla_security_claims.py \
            --repo-root . \
            --json-output artifacts/processed/LCLA_AKA/ci_security_audit.json \
            --report-output artifacts/processed/LCLA_AKA/ci_security_audit.md
      - name: 生成 LCLA-AKA cost model
        run: |
          python scripts/reproduce_lcla_cost_tables.py \
            --repo-root . \
            --json-output artifacts/processed/LCLA_AKA/ci_cost_tables.json \
            --csv-output artifacts/processed/LCLA_AKA/ci_cost_tables.csv \
            --report-output artifacts/processed/LCLA_AKA/ci_cost_tables.md
      - name: 生成 LCLA-AKA 无条件正确性 smoke evidence
        run: |
          python scripts/analyze_lcla_correctness.py \
            --repo-root . \
            --mode smoke \
            --matrix-output artifacts/processed/LCLA_AKA/ci_unconditioned_correctness_matrix.csv \
            --summary-output artifacts/processed/LCLA_AKA/ci_unconditioned_correctness_summary.json \
            --lemma-output artifacts/processed/LCLA_AKA/ci_lemma3_counterexamples.csv \
            --lemma-report-output artifacts/processed/LCLA_AKA/ci_lemma3_audit.md
          python scripts/reproduce_lcla_correctness_benchmarks.py \
            --repo-root . \
            --mode smoke \
            --resume \
            --raw-output artifacts/processed/LCLA_AKA/ci_correctness_patch_raw.csv \
            --correctness-input artifacts/processed/LCLA_AKA/ci_unconditioned_correctness_summary.json \
            --summary-output artifacts/processed/LCLA_AKA/ci_correctness_patch_summary.csv \
            --json-output artifacts/processed/LCLA_AKA/ci_correctness_patch_summary.json
      - name: 运行 LCLA-AKA Table IV smoke
        run: |
          python scripts/reproduce_lcla_table_iv.py \
            --repo-root . \
            --mode smoke \
            --warmup 0 \
            --repetitions 1 \
            --resume \
            --raw-output artifacts/processed/LCLA_AKA/ci_benchmark_raw.csv \
            --summary-output artifacts/processed/LCLA_AKA/ci_table_iv_reproduced.csv \
            --comparison-output artifacts/processed/LCLA_AKA/ci_table_iv_comparison.csv \
            --json-output artifacts/processed/LCLA_AKA/ci_table_iv_summary.json \
            --report-output artifacts/processed/LCLA_AKA/ci_table_iv_report.md
      - name: 运行 LCLA-AKA Table V smoke
        run: |
          python scripts/reproduce_lcla_table_v.py \
            --repo-root . \
            --mode smoke \
            --repetitions 1 \
            --resume \
            --raw-input artifacts/processed/LCLA_AKA/ci_benchmark_raw.csv \
            --table-iv-input artifacts/processed/LCLA_AKA/ci_table_iv_reproduced.csv \
            --table-output artifacts/processed/LCLA_AKA/ci_table_v_reproduced.csv \
            --phase-output artifacts/processed/LCLA_AKA/ci_table_v_protocol_phases.csv \
            --json-output artifacts/processed/LCLA_AKA/ci_table_v_summary.json \
            --report-output artifacts/processed/LCLA_AKA/ci_benchmark_report.md
      - name: 生成 LCLA-AKA Figure 4–6 smoke
        run: |
          python scripts/reproduce_lcla_figure4.py \
            --repo-root . \
            --table-input artifacts/processed/LCLA_AKA/ci_table_v_reproduced.csv \
            --data-output artifacts/processed/LCLA_AKA/ci_figure4_data.csv \
            --trend-output artifacts/processed/LCLA_AKA/ci_figure4_trend_summary.csv \
            --json-output artifacts/processed/LCLA_AKA/ci_figure4_summary.json \
            --figure-output artifacts/processed/LCLA_AKA/ci_figure4_reproduced.png
          python scripts/reproduce_lcla_figure5.py \
            --repo-root . \
            --data-output artifacts/processed/LCLA_AKA/ci_figure5_data.csv \
            --formula-output artifacts/processed/LCLA_AKA/ci_figure5_formulas.json \
            --figure-output artifacts/processed/LCLA_AKA/ci_figure5_reproduced.png
          python scripts/reproduce_lcla_figure6.py \
            --repo-root . \
            --data-output artifacts/processed/LCLA_AKA/ci_figure6_data.csv \
            --formula-output artifacts/processed/LCLA_AKA/ci_figure6_formulas.json \
            --figure-output artifacts/processed/LCLA_AKA/ci_figure6_reproduced.png
      - name: 生成 LCLA-AKA full evidence
        run: |
          python scripts/validate_lcla_full.py \
            --repo-root . \
            --mode smoke \
            --correctness-input artifacts/processed/LCLA_AKA/ci_unconditioned_correctness_summary.json \
            --json-output artifacts/processed/LCLA_AKA/ci_full_validation.json \
            --report-output artifacts/processed/LCLA_AKA/lcla_aka_full_validation.md
      - name: 校验 LCLA-AKA full evidence
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          evidence = json.loads(
              Path("artifacts/processed/LCLA_AKA/ci_full_validation.json").read_text()
          )
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert evidence["result"] == (
              "partial_reproduction_observed_correctness_failure_"
              "constructed_backend_unverified_security"
          )
          assert evidence["executable_validation_passed"] is True
          assert evidence["executable_state_machine_implemented"] is True
          assert evidence["static_relation_constructed"] is True
          assert evidence["accepted_session_consistency"] is True
          assert evidence["honest_execution_correctness_reproduced"] is False
          assert evidence["paper_correctness_claim_reproduced"] is False
          assert evidence["lemma3_universal_correctness"] is False
          assert evidence["conditional_accepted_path_smoke"] is True
          assert evidence["failed_protocol_cases"] == 0
          assert evidence["reconciliation_status"] is True
          assert evidence["m1_consistency"] is True
          assert evidence["m2_consistency"] is True
          assert evidence["session_key_consistency"] is True
          assert evidence["identity_recovery"] is True
          assert evidence["formal_security_verified"] is False
          assert evidence["mbr_formally_verified"] is False
          assert evidence["quantum_security_verified"] is False
          assert evidence["git_commit"] == head
          assert evidence["git_dirty"] is False
          PY
      - name: 上传 LCLA-AKA full evidence
        uses: actions/upload-artifact@v4
        with:
          name: LCLA-AKA-full-evidence
          path: |
            artifacts/processed/LCLA_AKA/dependency_capabilities.json
            artifacts/processed/LCLA_AKA/security_audit.json
            artifacts/processed/LCLA_AKA/ci_security_audit.json
            artifacts/processed/LCLA_AKA/ci_security_audit.md
            artifacts/processed/LCLA_AKA/cost_tables.json
            artifacts/processed/LCLA_AKA/cost_tables.csv
            artifacts/processed/LCLA_AKA/ci_cost_tables.json
            artifacts/processed/LCLA_AKA/ci_cost_tables.csv
            artifacts/processed/LCLA_AKA/ci_cost_tables.md
            artifacts/processed/LCLA_AKA/unconditioned_correctness_matrix.csv
            artifacts/processed/LCLA_AKA/unconditioned_correctness_summary.json
            artifacts/processed/LCLA_AKA/lemma3_counterexamples.csv
            artifacts/processed/LCLA_AKA/correctness_patch_benchmark_summary.csv
            artifacts/processed/LCLA_AKA/correctness_patch_benchmark_summary.json
            artifacts/processed/LCLA_AKA/ci_unconditioned_correctness_matrix.csv
            artifacts/processed/LCLA_AKA/ci_unconditioned_correctness_summary.json
            artifacts/processed/LCLA_AKA/ci_lemma3_counterexamples.csv
            artifacts/processed/LCLA_AKA/ci_lemma3_audit.md
            artifacts/processed/LCLA_AKA/ci_correctness_patch_raw.csv
            artifacts/processed/LCLA_AKA/ci_correctness_patch_summary.csv
            artifacts/processed/LCLA_AKA/ci_correctness_patch_summary.json
            reports/lcla_lemma3_audit.md
            artifacts/processed/LCLA_AKA/ci_benchmark_raw.csv
            artifacts/processed/LCLA_AKA/ci_table_iv_reproduced.csv
            artifacts/processed/LCLA_AKA/ci_table_iv_comparison.csv
            artifacts/processed/LCLA_AKA/ci_table_iv_summary.json
            artifacts/processed/LCLA_AKA/ci_table_v_reproduced.csv
            artifacts/processed/LCLA_AKA/ci_table_v_protocol_phases.csv
            artifacts/processed/LCLA_AKA/ci_table_v_summary.json
            artifacts/processed/LCLA_AKA/ci_benchmark_report.md
            artifacts/processed/LCLA_AKA/ci_figure4_data.csv
            artifacts/processed/LCLA_AKA/ci_figure4_trend_summary.csv
            artifacts/processed/LCLA_AKA/ci_figure4_summary.json
            artifacts/processed/LCLA_AKA/ci_figure4_reproduced.png
            artifacts/processed/LCLA_AKA/ci_figure5_data.csv
            artifacts/processed/LCLA_AKA/ci_figure5_formulas.json
            artifacts/processed/LCLA_AKA/ci_figure5_reproduced.png
            artifacts/processed/LCLA_AKA/ci_figure6_data.csv
            artifacts/processed/LCLA_AKA/ci_figure6_formulas.json
            artifacts/processed/LCLA_AKA/ci_figure6_reproduced.png
            artifacts/processed/LCLA_AKA/final_claims_matrix.csv
            artifacts/processed/LCLA_AKA/reproduction_summary.json
            artifacts/processed/LCLA_AKA/full_validation.json
            artifacts/processed/LCLA_AKA/ci_full_validation.json
            artifacts/processed/LCLA_AKA/lcla_aka_full_validation.md
