name: quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 更新 pip
        run: python -m pip install --upgrade pip
      - name: 安装项目与开发依赖
        run: python -m pip install -e ".[dev]"
      - name: 检查格式
        run: ruff format --check .
      - name: 静态检查
        run: ruff check .
      - name: 类型检查
        run: mypy
      - name: 单元测试
        run: python -m pytest
      - name: 构建分发包
        run: python -m build --no-isolation
      - name: 验证 wheel 内置 profile
        run: |
          python -m venv /tmp/lattice-wheel-smoke
          /tmp/lattice-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/lattice-wheel-smoke/bin/python -I -c 'from lattice_aka_repro import load_profile; assert load_profile("c2lake", "toy")["q"] == 257; assert load_profile("lcla_aka", "toy")["backend"] == "toy"'
