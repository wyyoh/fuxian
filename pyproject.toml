[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-aka-repro"
version = "0.1.0"
description = "格基无证书认证密钥协商论文的可审计复现基础设施"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2.3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.5,<1",
  "setuptools>=69,<82",
  "types-PyYAML>=6.0,<7",
  "wheel>=0.43,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/lattice_aka_repro/specs/c2lake" = ["specs/c2lake/parameter_profiles.yaml"]
"share/lattice_aka_repro/specs/lcla_aka" = ["specs/lcla_aka/parameter_profiles.yaml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
ignore = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
